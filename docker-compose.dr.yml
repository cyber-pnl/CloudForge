# CloudForge DR stack — Scaleway standby site.
#
# Replaces the AWS managed services with self-hosted equivalents:
# - nginx       → API Gateway
# - FastAPI app → Lambda functions (reuses handler logic via adapter)
# - PostgreSQL  → DynamoDB
# - Redis       → SQS / SNS / EventBridge
# - /data       → S3 (local filesystem on block volume)
#
# Usage:
#   docker compose -f docker-compose.dr.yml up -d
#   docker compose -f docker-compose.dr.yml down -v

services:
  postgres:
    image: postgres:17-alpine
    container_name: cf-dr-postgres
    environment:
      POSTGRES_DB: cloudforge
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: cloudforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudforge"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cf-dr-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: dr/Dockerfile
    container_name: cf-dr-app
    ports:
      - "8001:8000"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: cloudforge
      PG_USER: cloudforge
      PG_PASSWORD: cloudforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARTIFACT_DIR: /data/artifacts
      API_TOKEN: local-dev-token
      USERS_TABLE: cloudforge-users
      PROJECTS_TABLE: cloudforge-projects
      TABLE_NAME: cloudforge-projects
      USERS_TABLE_NAME: cloudforge-users
      ARTIFACT_BUCKET: /data/artifacts
      EVENT_BUS_NAME: cloudforge-events
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: dr/Dockerfile
    container_name: cf-dr-worker
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARTIFACT_DIR: /data/artifacts
      ARTIFACT_BUCKET: /data/artifacts
      ARTIFACT_PREFIX: artifacts/
      QUEUE_NAME: cloudforge-jobs
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    container_name: cf-dr-nginx
    ports:
      - "8081:80"
    volumes:
      - ./dr/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  appdata:
