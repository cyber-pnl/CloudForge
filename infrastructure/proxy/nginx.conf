# Unified cloud gateway — routes to Floci (AWS) or Floci-AZ (Azure).
#
# Header-based:  X-Cloud: aws    → Floci (AWS)
#                X-Cloud: azure  → Floci-AZ (Azure)
# No header:     random 50/50 split between the two clouds.

upstream aws_backend {
    server floci:4566;
}

upstream azure_backend {
    server floci-az:4577;
}

# Random split when no X-Cloud header is present.
# Each request hashes to one of the two backends.
split_clients $request_id $random_backend {
    50%   aws_backend;
    *     azure_backend;
}

map $http_x_cloud $cloud_backend {
    aws       aws_backend;
    azure     azure_backend;
    default   $random_backend;
}

server {
    listen 80;

    location / {
        proxy_pass http://$cloud_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the original X-Cloud downstream so each backend
        # can inspect it if needed (e.g. for logging).
        proxy_set_header X-Cloud $http_x_cloud;
    }
}
