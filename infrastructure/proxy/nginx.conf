# Unified cloud proxy — routes to Floci (AWS) or Feint (Scaleway).
#
# Header-based:  X-Region: aws      → Floci
#                X-Region: scaleway  → Feint
# No header:     random selection between the two backends.

upstream aws_backend {
    server floci:4566;
}

upstream scaleway_backend {
    server feint:4599;
}

# Random split when no X-Region header is present.
# Each request hashes to one of the two backends.
split_clients $request_id $random_backend {
    50%   aws_backend;
    *     scaleway_backend;
}

map $http_x_region $cloud_backend {
    aws       aws_backend;
    scaleway  scaleway_backend;
    default   $random_backend;
}

server {
    listen 80;

    location / {
        proxy_pass http://$cloud_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the original X-Region downstream so each backend
        # can inspect it if needed (e.g. for logging).
        proxy_set_header X-Region $http_x_region;
    }
}
