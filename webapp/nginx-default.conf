server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the local AWS execute plane.
    # Browsers talk to the console on this origin only, which keeps
    # authentication simple and avoids relying on CORS support that
    # the emulator does not provide on OPTIONS preflights.
    location /floci/ {
        proxy_pass http://floci:4566/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
