name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Promote the validated build to staging after the dev pipeline"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  TOFU_DIR: infrastructure/environments/dev

jobs:
  validate:
    name: "1 · Validate IaC"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: OpenTofu formatting
        run: make fmt-check

      - name: OpenTofu validation
        run: |
          make init
          make validate

  unit-tests:
    name: "2 · Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: make test

  security:
    name: "3 · Security gates"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build lambda packages
        run: make package

      - name: Trivy full report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: misconfig,secret,vuln
          exit-code: 0

      - name: Security gate — secrets (any finding fails)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: secret
          skip-files: "**/terraform.tfstate"
          exit-code: 1

      - name: Security gate — IaC misconfigurations (HIGH and CRITICAL fail)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Security gate — dependency vulnerabilities (HIGH and CRITICAL fail)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1

  integration:
    name: "4 · Integration on ephemeral dev"
    needs: [validate, unit-tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: Build lambda packages
        run: make package

      - name: Start Floci
        run: |
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4566/ > /dev/null; then
              echo "Floci is up"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Floci did not become reachable"
              docker compose logs floci
              exit 1
            fi
            sleep 2
          done

      - name: OpenTofu plan against Floci
        run: make plan TF_ARGS=-input=false

      - name: Apply infrastructure
        run: make apply AUTO_APPROVE=true

      - name: Integration tests
        run: ./scripts/integration-tests.sh

      - name: Destroy ephemeral infrastructure
        if: always()
        continue-on-error: true
        run: |
           # Empty the artifacts bucket
           aws s3 rm s3://cloudforge-dev-artifacts --recursive || true
           tofu -chdir=$TOFU_DIR destroy -auto-approve -input=false

  promote-staging:
    name: "5 · Promote to staging"
    needs: [integration]
    if: inputs.deploy_staging == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: Deploy staging and verify
        run: |
          tofu -chdir=infrastructure/environments/staging init -input=false
          tofu -chdir=infrastructure/environments/staging apply -auto-approve -input=false
          TOFU_DIR=infrastructure/environments/staging ./scripts/integration-tests.sh
