# Unified cloud gateway — routes all traffic to Floci (AWS).
#
# A previous iteration load-balanced 50/50 between Floci (AWS) and
# Floci-AZ (Azure). That was dropped because the Azure Function Apps are not
# exercisable: Floci-AZ does not emulate Microsoft.Web/serverfarms (App Service
# Plans), so `tofu apply` of the Azure stack can never complete and there is no
# deployable Azure workload behind the gateway. All traffic is therefore routed
# to the AWS backend.
#
# See docs/02-infrastructure/multicloud-journal.md for the full rationale.

upstream aws_backend {
    server floci:4566;
}

server {
    listen 80;

    location / {
        proxy_pass http://aws_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
