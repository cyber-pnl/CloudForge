services:
  floci:
    image: floci/floci:1.7.0
    container_name: cloudforge-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_DEFAULT_REGION: us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root

  floci-az:
    image: floci/floci-az:latest
    container_name: cloudforge-floci-az
    ports:
      - "4577:4577"
      - "5672:5672"
      - "5673:5673"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  gateway:
    image: nginx:1.29-alpine
    container_name: cloudforge-gateway
    ports:
      - "4600:80"
    volumes:
      - ./infrastructure/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - floci
      - floci-az

  exporter:
    build: ./observability/exporter
    container_name: cloudforge-exporter
    ports:
      - "9877:9877"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      API_HEALTH_URL: http://floci:4566/_localstack/health
      POLL_INTERVAL: "15"
    depends_on:
      - floci

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: cloudforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:12.4.2
    container_name: cloudforge-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  webapp:
    image: nginx:1.29-alpine
    container_name: cloudforge-webapp
    ports:
      - "8080:80"
    volumes:
      - ./webapp:/usr/share/nginx/html:ro
      - ./webapp/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
